name: 🐛 Bug Report
description: Signaler un bug ou dysfonctionnement
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug ! Remplissez les sections ci-dessous pour nous aider à le résoudre rapidement.

  - type: textarea
    id: description
    attributes:
      label: 📝 Description du bug
      description: Qu'est-ce qui ne fonctionne pas comme prévu ?
      placeholder: |
        Ex: Impossible de sauvegarder une analyse SWOT
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 Étapes pour reproduire
      description: Comment reproduire ce bug ?
      placeholder: |
        1. Aller sur la page '/client-a/iso/context/swot-pestel'
        2. Remplir la matrice SWOT
        3. Cliquer sur "Enregistrer"
        4. Voir l'erreur...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Comportement attendu
      description: Que devrait-il se passer ?
      placeholder: |
        Ex: L'analyse SWOT devrait être sauvegardée et un message de succès affiché
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 📦 Module concerné
      options:
        - Client A (ISO)
        - Client B
        - Company
        - Super Admin
        - Backend API
        - Frontend UI
        - Autre
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🔥 Sévérité
      options:
        - 🔴 Critique - Bloquant
        - 🟠 Majeur - Important
        - 🟡 Mineur - Gêne
        - 🟢 Cosmétique
    validations:
      required: true
