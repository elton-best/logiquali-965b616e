name: Cypress E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: Cypress E2E (backend+frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: BestQHSE
          POSTGRES_USER: adminpg
          POSTGRES_PASSWORD: Yvan0408
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, json, openssl, zip

      - name: Install backend dependencies
        working-directory: ./backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy backend .env and generate app key
        working-directory: ./backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run backend migrations
        working-directory: ./backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: BestQHSE
          DB_USERNAME: adminpg
          DB_PASSWORD: Yvan0408
        run: php artisan migrate --force

      - name: Start backend server
        working-directory: ./backend
        run: |
          php -S 127.0.0.1:8000 -t public >/tmp/backend.log 2>&1 &
          sleep 2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Serve frontend preview
        working-directory: ./frontend
        run: npm run preview -- --port 4173 >/tmp/frontend.log 2>&1 &

      - name: Wait for services
        run: |
          echo "Waiting for backend and frontend..."
          n=0; until curl -sSf http://127.0.0.1:8000 || [ $n -ge 15 ]; do n=$((n+1)); sleep 2; done
          n=0; until curl -sSf http://127.0.0.1:4173 || [ $n -ge 15 ]; do n=$((n+1)); sleep 2; done

      - name: Run Cypress tests
        uses: cypress-io/github-action@v4
        with:
          start: ''
          command: npx cypress run --config baseUrl=http://127.0.0.1:4173
